  description: 面向技术求职的面试陪练官。知识库与检索全部落在本机真实 seekdb（OceanBase 单机版）：知识库节点走 Dify 原生 seekdb
    混合检索，另挂一个自研 seekdb 全文+向量 RRF 检索工具做双保险与消融对照。
