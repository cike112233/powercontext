    opening_statement: '我是基于 seekdb 知识库的面试陪练官。你可以直接抛一个技术点（例如"MySQL 索引失效"），我会像真面试官一样连环追问。

      想切换 seekdb 的检索方式，把开关写在句子最前面：「纯向量：…」只走 HNSW 向量，「全文：…」只走 ik 倒排，不写就默认混合检索；句子里带上「证据」，我会把
      seekdb 的 EXPLAIN 执行计划贴给你。每轮结尾那行「检索小结」由检索服务直接给出，不是我估的。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我从数据库方向开始模拟一面，先问一道中级题
    - InnoDB 的 MVCC 是怎么保证一致性读的？
    - 纯向量：连接池 maxLifetime 要小于哪个服务端参数？
    - 全文：如何用 EXPLAIN 判断走没走索引？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
